set timeout=5
set default=0

# Графический режим для команды `gui` (Phase 4 framebuffer).
# gfxpayload=keep оставляет видеорежим ядру, Multiboot2 tag 8 несёт параметры.
set gfxmode=1024x768x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "AI-OS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.img initrd
}
